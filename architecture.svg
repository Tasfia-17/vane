<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f2744"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bg)" rx="12"/>
  <rect width="900" height="520" fill="none" stroke="#334155" stroke-width="1" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="3">VANE SYSTEM ARCHITECTURE</text>

  <!-- ===== LEFT COLUMN: Data Sources ===== -->

  <!-- AVE Data API box -->
  <g filter="url(#shadow)">
    <rect x="30" y="60" width="160" height="56" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
    <!-- 3D top edge -->
    <rect x="30" y="60" width="160" height="6" rx="8" fill="#334155" opacity="0.6"/>
  </g>
  <text x="110" y="84" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1">AVE DATA API</text>
  <text x="110" y="100" font-size="8" fill="#64748b" text-anchor="middle">data.ave-api.xyz/v2</text>

  <!-- AVE WebSocket box -->
  <g filter="url(#shadow)">
    <rect x="30" y="140" width="160" height="56" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="30" y="140" width="160" height="6" rx="8" fill="#334155" opacity="0.6"/>
  </g>
  <text x="110" y="164" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1">AVE WEBSOCKET</text>
  <text x="110" y="180" font-size="8" fill="#64748b" text-anchor="middle">wss.ave-api.xyz</text>

  <!-- AVE Trade API box -->
  <g filter="url(#shadow)">
    <rect x="30" y="220" width="160" height="56" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="30" y="220" width="160" height="6" rx="8" fill="#334155" opacity="0.6"/>
  </g>
  <text x="110" y="244" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1">AVE TRADE API</text>
  <text x="110" y="260" font-size="8" fill="#64748b" text-anchor="middle">bot-api.ave.ai</text>

  <!-- ===== MIDDLE COLUMN: Backend Services ===== -->

  <!-- Holder Poller -->
  <g filter="url(#shadow)">
    <rect x="250" y="60" width="140" height="50" rx="8" fill="url(#boxGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="250" y="60" width="140" height="6" rx="8" fill="#475569" opacity="0.5"/>
  </g>
  <text x="320" y="82" font-size="9" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">HOLDER POLLER</text>
  <text x="320" y="97" font-size="7.5" fill="#64748b" text-anchor="middle">60s cron interval</text>

  <!-- Tx Listener -->
  <g filter="url(#shadow)">
    <rect x="250" y="140" width="140" height="50" rx="8" fill="url(#boxGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="250" y="140" width="140" height="6" rx="8" fill="#475569" opacity="0.5"/>
  </g>
  <text x="320" y="162" font-size="9" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">TX LISTENER</text>
  <text x="320" y="177" font-size="7.5" fill="#64748b" text-anchor="middle">real-time swap stream</text>

  <!-- Signal Engine (highlighted) -->
  <g filter="url(#shadow)">
    <rect x="240" y="240" width="160" height="70" rx="8" fill="url(#engineGrad)" stroke="#3b82f6" stroke-width="2"/>
    <rect x="240" y="240" width="160" height="8" rx="8" fill="#3b82f6" opacity="0.3"/>
  </g>
  <text x="320" y="264" font-size="10" fill="#93c5fd" text-anchor="middle" letter-spacing="1" font-weight="bold">SIGNAL ENGINE</text>
  <text x="320" y="280" font-size="7.5" fill="#60a5fa" text-anchor="middle">Danger Score 0-100</text>
  <text x="320" y="295" font-size="7" fill="#475569" text-anchor="middle">RELAXED / NORMAL / ALERT / WARNING / CRITICAL</text>

  <!-- Score Manager -->
  <g filter="url(#shadow)">
    <rect x="250" y="340" width="140" height="50" rx="8" fill="url(#boxGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="250" y="340" width="140" height="6" rx="8" fill="#475569" opacity="0.5"/>
  </g>
  <text x="320" y="362" font-size="9" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">SCORE MANAGER</text>
  <text x="320" y="377" font-size="7.5" fill="#64748b" text-anchor="middle">adjustStop / hardExit</text>

  <!-- Event Bus label -->
  <text x="320" y="430" font-size="8" fill="#475569" text-anchor="middle" letter-spacing="2">EVENT BUS (eventemitter3)</text>
  <line x1="250" y1="435" x2="390" y2="435" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ===== RIGHT COLUMN: Outputs ===== -->

  <!-- PostgreSQL -->
  <g filter="url(#shadow)">
    <rect x="470" y="60" width="140" height="50" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="470" y="60" width="140" height="6" rx="8" fill="#334155" opacity="0.5"/>
  </g>
  <text x="540" y="82" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1">POSTGRESQL</text>
  <text x="540" y="97" font-size="7.5" fill="#64748b" text-anchor="middle">positions, signals, trades</text>

  <!-- WS Server -->
  <g filter="url(#shadow)">
    <rect x="470" y="140" width="140" height="50" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="470" y="140" width="140" height="6" rx="8" fill="#334155" opacity="0.5"/>
  </g>
  <text x="540" y="162" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1">WS SERVER</text>
  <text x="540" y="177" font-size="7.5" fill="#64748b" text-anchor="middle">push to frontend</text>

  <!-- Trade Executor -->
  <g filter="url(#shadow)">
    <rect x="470" y="220" width="140" height="50" rx="8" fill="url(#boxGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="470" y="220" width="140" height="6" rx="8" fill="#ef4444" opacity="0.2"/>
  </g>
  <text x="540" y="242" font-size="9" fill="#fca5a5" text-anchor="middle" letter-spacing="1">TRADE EXECUTOR</text>
  <text x="540" y="257" font-size="7.5" fill="#64748b" text-anchor="middle">cancel + recreate order</text>

  <!-- HTTP Server -->
  <g filter="url(#shadow)">
    <rect x="470" y="300" width="140" height="50" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="470" y="300" width="140" height="6" rx="8" fill="#334155" opacity="0.5"/>
  </g>
  <text x="540" y="322" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1">HTTP SERVER</text>
  <text x="540" y="337" font-size="7.5" fill="#64748b" text-anchor="middle">REST API :3001</text>

  <!-- ===== FAR RIGHT: Frontend ===== -->

  <!-- Next.js Frontend -->
  <g filter="url(#shadow)">
    <rect x="690" y="100" width="170" height="280" rx="10" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="690" y="100" width="170" height="8" rx="10" fill="#334155" opacity="0.5"/>
  </g>
  <text x="775" y="124" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="2">FRONTEND</text>
  <text x="775" y="138" font-size="7.5" fill="#64748b" text-anchor="middle">Next.js 14 + TypeScript</text>

  <!-- Frontend components -->
  <rect x="706" y="150" width="138" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="775" y="169" font-size="8" fill="#94a3b8" text-anchor="middle">DangerGauge</text>

  <rect x="706" y="188" width="138" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="775" y="207" font-size="8" fill="#94a3b8" text-anchor="middle">HolderTable</text>

  <rect x="706" y="226" width="138" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="775" y="245" font-size="8" fill="#94a3b8" text-anchor="middle">PositionCard</text>

  <rect x="706" y="264" width="138" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="775" y="283" font-size="8" fill="#94a3b8" text-anchor="middle">Zustand Store</text>

  <rect x="706" y="302" width="138" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="775" y="321" font-size="8" fill="#94a3b8" text-anchor="middle">useWebSocket hook</text>

  <rect x="706" y="340" width="138" height="28" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="775" y="359" font-size="8" fill="#94a3b8" text-anchor="middle">localhost:3000</text>

  <!-- ===== ARROWS ===== -->

  <!-- AVE Data API -> Holder Poller -->
  <line x1="190" y1="88" x2="248" y2="88" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="219" y="83" font-size="6.5" fill="#475569" text-anchor="middle">REST</text>

  <!-- AVE WSS -> Tx Listener -->
  <line x1="190" y1="168" x2="248" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="219" y="163" font-size="6.5" fill="#475569" text-anchor="middle">WSS</text>

  <!-- Holder Poller -> Signal Engine -->
  <line x1="320" y1="110" x2="320" y2="238" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrowBlue)"/>

  <!-- Tx Listener -> Signal Engine -->
  <line x1="340" y1="190" x2="340" y2="238" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrowBlue)"/>

  <!-- Signal Engine -> Score Manager -->
  <line x1="320" y1="310" x2="320" y2="338" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Score Manager -> Trade Executor -->
  <line x1="390" y1="365" x2="468" y2="245" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Score Manager -> DB -->
  <line x1="390" y1="355" x2="468" y2="90" stroke="#475569" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

  <!-- Score Manager -> WS Server -->
  <line x1="390" y1="360" x2="468" y2="168" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Trade Executor -> AVE Trade API -->
  <line x1="470" y1="248" x2="192" y2="248" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrowRed)"/>

  <!-- WS Server -> Frontend -->
  <line x1="610" y1="165" x2="688" y2="240" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="655" y="195" font-size="6.5" fill="#10b981" text-anchor="middle">WS push</text>

  <!-- HTTP Server -> Frontend -->
  <line x1="610" y1="325" x2="688" y2="325" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="649" y="320" font-size="6.5" fill="#475569" text-anchor="middle">REST</text>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="460" width="840" height="46" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <line x1="50" y1="483" x2="80" y2="483" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="88" y="487" font-size="7.5" fill="#64748b">holder snapshot event</text>
  <line x1="180" y1="483" x2="210" y2="483" stroke="#10b981" stroke-width="1.5"/>
  <text x="218" y="487" font-size="7.5" fill="#64748b">live push to frontend</text>
  <line x1="320" y1="483" x2="350" y2="483" stroke="#ef4444" stroke-width="1.5"/>
  <text x="358" y="487" font-size="7.5" fill="#64748b">trade execution</text>
  <line x1="450" y1="483" x2="480" y2="483" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="488" y="487" font-size="7.5" fill="#64748b">REST / DB write</text>
  <text x="775" y="487" font-size="7.5" fill="#334155" text-anchor="middle">AVE Claw Hackathon 2026</text>
</svg>
