<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="blade1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#94a3b8"/>
    </linearGradient>
    <linearGradient id="blade2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cbd5e1"/>
      <stop offset="100%" style="stop-color:#64748b"/>
    </linearGradient>
    <linearGradient id="blade3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#475569"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- 3D base platform -->
  <ellipse cx="100" cy="158" rx="28" ry="8" fill="#0f172a" opacity="0.6"/>
  <rect x="88" y="148" width="24" height="14" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="88" y="148" width="24" height="4" rx="2" fill="#334155"/>

  <!-- Pole -->
  <rect x="98" y="90" width="4" height="60" rx="2" fill="#475569"/>
  <rect x="98" y="90" width="2" height="60" rx="1" fill="#64748b"/>

  <!-- Vane blade 1 (pointing right, 3D effect) -->
  <g filter="url(#shadow)" transform="rotate(-20, 100, 92)">
    <polygon points="100,92 145,80 145,86 100,98" fill="url(#blade1)"/>
    <polygon points="100,92 145,80 145,82 100,94" fill="#f8fafc" opacity="0.4"/>
  </g>

  <!-- Vane blade 2 (pointing left) -->
  <g filter="url(#shadow)" transform="rotate(-20, 100, 92)">
    <polygon points="100,92 55,80 55,86 100,98" fill="url(#blade2)"/>
    <polygon points="100,92 55,80 55,82 100,94" fill="#f8fafc" opacity="0.2"/>
  </g>

  <!-- Vane blade 3 (pointing up, shorter) -->
  <g filter="url(#shadow)" transform="rotate(-20, 100, 92)">
    <polygon points="100,92 92,52 96,50 104,92" fill="url(#blade3)"/>
  </g>

  <!-- Center pivot -->
  <circle cx="100" cy="92" r="5" fill="#e2e8f0" filter="url(#shadow)"/>
  <circle cx="100" cy="92" r="3" fill="#f8fafc"/>
  <circle cx="100" cy="92" r="1.5" fill="#94a3b8"/>

  <!-- Danger score arc (subtle) -->
  <path d="M 60 130 A 45 45 0 0 1 140 130" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M 60 130 A 45 45 0 0 1 100 88" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" opacity="0.3"/>

  <!-- Text -->
  <text x="100" y="178" font-family="'SF Mono', 'Fira Code', monospace" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="middle" letter-spacing="6">VANE</text>
  <text x="100" y="191" font-family="'SF Mono', 'Fira Code', monospace" font-size="6" fill="#64748b" text-anchor="middle" letter-spacing="2">READS THE WIND</text>
</svg>
