<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" font-family="'SF Mono','Fira Code','Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/></filter>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#475569"/>
    </marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#10b981"/>
    </marker>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#ef4444"/>
    </marker>
    <marker id="ay" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="860" height="340" fill="url(#bg)" rx="10"/>
  <rect width="860" height="340" fill="none" stroke="#1e293b" stroke-width="1.5" rx="10"/>
  <text x="430" y="28" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="3">SIGNAL DETECTION FLOW</text>

  <!-- Step 1: Position opened -->
  <g filter="url(#s)">
    <rect x="30" y="55" width="130" height="52" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="30" y="55" width="130" height="7" rx="7" fill="#334155" opacity="0.7"/>
  </g>
  <text x="95" y="78" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1">POSITION OPENED</text>
  <text x="95" y="93" font-size="7.5" fill="#64748b" text-anchor="middle">risk check + dev wallet</text>
  <text x="95" y="104" font-size="7.5" fill="#64748b" text-anchor="middle">registered from risk API</text>

  <!-- Step 2: Two parallel paths -->
  <line x1="160" y1="81" x2="195" y2="81" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Fork point -->
  <circle cx="200" cy="81" r="4" fill="#475569"/>
  <line x1="200" y1="77" x2="200" y2="55" stroke="#475569" stroke-width="1.5"/>
  <line x1="200" y1="55" x2="310" y2="55" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="200" y1="85" x2="200" y2="115" stroke="#475569" stroke-width="1.5"/>
  <line x1="200" y1="115" x2="310" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Path A: Holder Poller -->
  <g filter="url(#s)">
    <rect x="312" y="38" width="130" height="38" rx="7" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="377" y="55" font-size="9" fill="#93c5fd" text-anchor="middle" letter-spacing="1">HOLDER POLLER</text>
  <text x="377" y="68" font-size="7.5" fill="#60a5fa" text-anchor="middle">every 60 seconds</text>

  <!-- Path B: Tx Listener -->
  <g filter="url(#s)">
    <rect x="312" y="98" width="130" height="38" rx="7" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="377" y="115" font-size="9" fill="#93c5fd" text-anchor="middle" letter-spacing="1">TX LISTENER</text>
  <text x="377" y="128" font-size="7.5" fill="#60a5fa" text-anchor="middle">real-time WebSocket</text>

  <!-- Both -> Signal Engine -->
  <line x1="442" y1="57" x2="490" y2="81" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="442" y1="117" x2="490" y2="93" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Signal Engine -->
  <g filter="url(#s)">
    <rect x="492" y="55" width="140" height="52" rx="7" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
    <rect x="492" y="55" width="140" height="7" rx="7" fill="#3b82f6" opacity="0.3"/>
  </g>
  <text x="562" y="78" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="bold">SIGNAL ENGINE</text>
  <text x="562" y="93" font-size="7.5" fill="#60a5fa" text-anchor="middle">compute Danger Score 0-100</text>
  <text x="562" y="104" font-size="7" fill="#475569" text-anchor="middle">fresh per snapshot, no accumulation</text>

  <!-- Signal Engine -> Score Manager -->
  <line x1="632" y1="81" x2="668" y2="81" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Score Manager -->
  <g filter="url(#s)">
    <rect x="670" y="55" width="140" height="52" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="670" y="55" width="140" height="7" rx="7" fill="#475569" opacity="0.5"/>
  </g>
  <text x="740" y="78" font-size="9" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">SCORE MANAGER</text>
  <text x="740" y="93" font-size="7.5" fill="#64748b" text-anchor="middle">react only on mode change</text>
  <text x="740" y="104" font-size="7" fill="#475569" text-anchor="middle">lastMode dedup guard</text>

  <!-- Score Manager branches down -->
  <line x1="740" y1="107" x2="740" y2="140" stroke="#475569" stroke-width="1.5"/>
  <circle cx="740" cy="144" r="4" fill="#475569"/>

  <!-- Branch 1: RELAXED/NORMAL/ALERT/WARNING -> adjustStop -->
  <line x1="736" y1="144" x2="580" y2="144" stroke="#10b981" stroke-width="1.5"/>
  <line x1="580" y1="144" x2="580" y2="168" stroke="#10b981" stroke-width="1.5" marker-end="url(#ag)"/>

  <g filter="url(#s)">
    <rect x="490" y="170" width="180" height="52" rx="7" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
    <rect x="490" y="170" width="180" height="7" rx="7" fill="#10b981" opacity="0.2"/>
  </g>
  <text x="580" y="192" font-size="9" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">ADJUST STOP</text>
  <text x="580" y="207" font-size="7.5" fill="#34d399" text-anchor="middle">cancel order + recreate</text>
  <text x="580" y="218" font-size="7" fill="#475569" text-anchor="middle">new autoSellConfig bps</text>

  <!-- Branch 2: CRITICAL -> hardExit -->
  <line x1="744" y1="144" x2="760" y2="144" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="760" y1="144" x2="760" y2="168" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ar)"/>

  <g filter="url(#s)">
    <rect x="680" y="170" width="150" height="52" rx="7" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <rect x="680" y="170" width="150" height="7" rx="7" fill="#ef4444" opacity="0.3"/>
  </g>
  <text x="755" y="192" font-size="9" fill="#fca5a5" text-anchor="middle" letter-spacing="1">HARD EXIT</text>
  <text x="755" y="207" font-size="7.5" fill="#f87171" text-anchor="middle">15% slippage, market sell</text>
  <text x="755" y="218" font-size="7" fill="#475569" text-anchor="middle">remove from memory + DB close</text>

  <!-- Labels on branches -->
  <text x="650" y="138" font-size="7.5" fill="#10b981" text-anchor="middle">RELAXED / NORMAL / ALERT / WARNING</text>
  <text x="760" y="138" font-size="7.5" fill="#ef4444" text-anchor="end">CRITICAL</text>

  <!-- Both -> AVE Trade API -->
  <line x1="580" y1="222" x2="580" y2="260" stroke="#10b981" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="755" y1="222" x2="755" y2="260" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ar)"/>

  <g filter="url(#s)">
    <rect x="490" y="262" width="320" height="42" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="490" y="262" width="320" height="7" rx="7" fill="#334155" opacity="0.5"/>
  </g>
  <text x="650" y="282" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1">AVE PROXY WALLET</text>
  <text x="650" y="296" font-size="7.5" fill="#64748b" text-anchor="middle">sendSwapOrder / cancelLimitOrder — bot-api.ave.ai</text>

  <!-- Also -> DB and WS -->
  <line x1="492" y1="196" x2="380" y2="196" stroke="#475569" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <g filter="url(#s)">
    <rect x="240" y="170" width="138" height="52" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="309" y="192" font-size="9" fill="#94a3b8" text-anchor="middle">DB WRITE</text>
  <text x="309" y="207" font-size="7.5" fill="#64748b" text-anchor="middle">signal_events</text>
  <text x="309" y="218" font-size="7.5" fill="#64748b" text-anchor="middle">trade_executions</text>

  <line x1="309" y1="170" x2="309" y2="140" stroke="#475569" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="309" y1="140" x2="200" y2="140" stroke="#475569" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="200" y1="140" x2="200" y2="107" stroke="#475569" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a)"/>

  <g filter="url(#s)">
    <rect x="30" y="170" width="138" height="52" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="99" y="192" font-size="9" fill="#94a3b8" text-anchor="middle">WS BROADCAST</text>
  <text x="99" y="207" font-size="7.5" fill="#64748b" text-anchor="middle">score:update</text>
  <text x="99" y="218" font-size="7.5" fill="#64748b" text-anchor="middle">stop:adjusted / trade:executed</text>

  <line x1="240" y1="196" x2="170" y2="196" stroke="#475569" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a)"/>
</svg>
